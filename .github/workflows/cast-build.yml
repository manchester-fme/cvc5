name: CAST Build

on:
  workflow_dispatch: {}

permissions:
  id-token: write

jobs:
  cast-build:
    uses: manchester-fme/CAST/.github/workflows/build.yml@feature/parametric-coverage-fuzzer
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      build_script: cvc5/.cast/build.sh
      solver_dir: cvc5/.cast
      force_run: true
    secrets: inherit
