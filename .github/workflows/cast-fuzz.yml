name: CAST Commit Fuzzer

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'cvc5 commit to fuzz (required for a manual run in this fork - there is no fuzzing-schedule state yet to auto-select one)'
        required: true
        type: string

permissions:
  id-token: write

jobs:
  cast-fuzz:
    uses: manchester-fme/CAST/.github/workflows/commit-fuzzer.yml@feature/parametric-coverage-fuzzer
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: cvc5/.cast
      commit_hash: ${{ inputs.commit_hash }}
    secrets: inherit
