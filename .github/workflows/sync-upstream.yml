name: Sync upstream

# Keeps this fork's main merged with upstream cvc5/cvc5's main. Needed for
# CAST's pipeline to have anything new to build/fuzz at all: manager.yml
# polls this fork's own commit history (cast.yml passes repo_url as this
# fork's own URL, not upstream's) for new commits, so upstream commits that
# never land here are invisible to the whole build-queue/fuzzing-schedule
# machinery.
#
# Plain merge + push, no rebase (rebasing would rewrite this fork's own
# .cast/ and .github/workflows/cast.yml commit history) and no PR (the goal
# is main always being current, not a human merging each sync). This fork's
# own commits only ever touch .cast/ and .github/workflows/ - disjoint from
# upstream's src/, test/, etc. - so real merge conflicts should be rare. If
# one does happen, the job fails loudly rather than guessing (no
# auto-resolution, no force-push) - needs a human to resolve it manually.

on:
  schedule:
    - cron: '0 * * * *'  # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main
        run: |
          git remote add upstream https://github.com/cvc5/cvc5.git
          git fetch upstream main

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" = "0" ]; then
            echo "✅ Already up to date with upstream/main"
            exit 0
          fi

          echo "📥 $BEHIND new commit(s) on upstream/main - merging"
          git merge upstream/main --no-edit
          git push origin main
          echo "✅ Merged and pushed upstream/main ($BEHIND commit(s))"
