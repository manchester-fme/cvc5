name: CAST

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options:
          - manager
          - build
          - coverage
          - daily-check
          - fuzz
      commit_hash:
        description: 'Required for fuzz; bypasses queue/schedule lookup for manager and build'
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  manager:
    if: inputs.action == 'manager'
    uses: manchester-fme/CAST/.github/workflows/manager.yml@feature/parametric-coverage-fuzzer
    with:
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      commit_hash: ${{ inputs.commit_hash }}
    secrets: inherit

  build:
    if: inputs.action == 'build'
    uses: manchester-fme/CAST/.github/workflows/build.yml@feature/parametric-coverage-fuzzer
    with:
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      build_script: cvc5/.cast/build.sh
      commit_hash: ${{ inputs.commit_hash }}
      force_run: true
    secrets: inherit

  coverage:
    if: inputs.action == 'coverage'
    uses: manchester-fme/CAST/.github/workflows/coverage-mapper.yml@feature/parametric-coverage-fuzzer
    with:
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: cvc5/.cast
    secrets: inherit

  daily-check:
    if: inputs.action == 'daily-check'
    uses: manchester-fme/CAST/.github/workflows/coverage-daily-check.yml@feature/parametric-coverage-fuzzer
    with:
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: cvc5/.cast
    secrets: inherit

  fuzz:
    if: inputs.action == 'fuzz'
    uses: manchester-fme/CAST/.github/workflows/commit-fuzzer.yml@feature/parametric-coverage-fuzzer
    with:
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: cvc5/.cast
      commit_hash: ${{ inputs.commit_hash }}
    secrets: inherit
