name: CAST

run-name: >-
  CAST: ${{ inputs.action
  || (github.event.schedule == '30 3 * * *' && 'daily-check')
  || 'cycle' }}

# Every 6h: build the latest commit, fuzz it (~5h) using coverage-guided
# test selection, then triage whatever bugs that run found (~1h) -- one
# sequential run per tick rather than separate manager/build/fuzz
# schedules, to stay well under the org's Actions concurrency limits.
# `needs:` chains the three jobs so they run in order within a single
# workflow run instead of overlapping, and `concurrency:` below queues a
# tick rather than starting a second cycle if the previous one is still
# running long. daily-check keeps its own schedule (offset from the cycle
# hours) since it's what keeps the coverage map fuzz relies on fresh --
# it calls coverage-mapper.yml itself when a rebuild is actually needed,
# so no separate monthly coverage cron is required either.
#
# There's no separate commit-polling step (manager.yml) any more --
# build.yml's force_run:true already resolves+builds the current upstream
# HEAD directly when its queue is empty, which it always is without
# manager.yml feeding it.

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options:
          - cycle
          - build
          - fuzz
          - triage
          - daily-check
      commit_hash:
        description: 'Optional: commit hash (build/cycle only; ignored on a scheduled run)'
        required: false
        type: string
  schedule:
    - cron: '0 0,6,12,18 * * *'  # cycle: build -> fuzz (~5h) -> triage (~1h)
    - cron: '30 3 * * *'         # daily-check: rebuild the coverage map if needed

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: cast-cycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: CAST Build
    if: inputs.action == 'cycle' || inputs.action == 'build' || github.event.schedule == '0 0,6,12,18 * * *'
    uses: manchester-fme/CAST/.github/workflows/build.yml@main
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      build_script: cvc5/.cast/build.sh
      binary_path: build/bin/cvc5
      commit_hash: ${{ inputs.commit_hash }}
      force_run: true
    secrets: inherit

  fuzz:
    name: CAST Fuzz
    needs: build
    if: inputs.action == 'cycle' || inputs.action == 'fuzz' || github.event.schedule == '0 0,6,12,18 * * *'
    uses: manchester-fme/CAST/.github/workflows/commit-fuzzer.yml@main
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: cvc5/.cast
      stop_buffer_minutes: 60  # GitHub's default 360-min job timeout minus this = ~5h fuzz budget
    secrets: inherit

  triage:
    name: CAST Triage
    needs: fuzz
    if: inputs.action == 'cycle' || inputs.action == 'triage' || github.event.schedule == '0 0,6,12,18 * * *'
    uses: manchester-fme/CAST/.github/workflows/triage.yml@main
    with:
      solver: cvc5
      target_cmd: "cvc5 -q --check-models --check-proofs"
      oracle_cmd: "z3 model_validate=true"
      # archive/commit_hash left empty: auto-discovers this cycle's build/bugs
      post: true
    secrets: inherit

  daily-check:
    name: CAST Daily Check
    if: inputs.action == 'daily-check' || github.event.schedule == '30 3 * * *'
    uses: manchester-fme/CAST/.github/workflows/coverage-daily-check.yml@main
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: cvc5/.cast
    secrets: inherit
