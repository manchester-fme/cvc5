name: CAST

run-name: >-
  CAST: ${{ inputs.action
  || (github.event.schedule == '0 * * * *' && 'manager')
  || (github.event.schedule == '30 3 * * *' && 'daily-check')
  || 'cycle' }}

# manager polls the real upstream repo (repo_url below) hourly for new
# C++-affecting commits and queues them; every 6h, build picks the next
# queued commit, fuzzes it (~5h) using coverage-guided test selection, then
# triages whatever bugs that run found (~1h) -- one sequential run per tick
# for build/fuzz/triage, `needs:` chaining them in order within a single
# workflow run instead of overlapping. `concurrency:` below queues a tick
# (manager's hourly or the build/fuzz/triage cycle's 6-hourly one) rather
# than starting a second run if the previous one is still going, which is
# also what keeps this safely under the org's Actions concurrency limits:
# manager is a single lightweight job (no matrix fan-out) and can never run
# at the same time as this repo's own fuzz matrix, so per solver the ceiling
# stays whatever fuzz's max_jobs already was -- reinstating manager adds no
# extra concurrent headroom requirement.
#
# This fork is used purely to host .cast/ (this file plus manifest.json/
# build.sh) -- it is never itself built, fuzzed, or coverage-mapped, and
# nothing keeps it merged with upstream any more. build/fuzz/coverage/
# daily-check below all set repo_url to real upstream (where the actual
# solver source these jobs build/fuzz/coverage-map comes from) and layer
# .cast/ on top from this fork automatically -- github.repository already
# resolves to this fork inside a workflow_call'd job, so nothing needs to
# be passed explicitly for that part. manager only needs repo_url; it
# never touches .cast/.
#
# daily-check keeps its own schedule (offset from the cycle hours) since
# it's what keeps the coverage map fuzz relies on fresh -- it calls
# coverage-mapper.yml itself when a rebuild is actually needed, so no
# separate monthly coverage cron is required either.

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options:
          - cycle
          - manager
          - build
          - fuzz
          - triage
          - daily-check
      commit_hash:
        description: 'Optional: commit hash (manager/build/triage/cycle only; ignored on a scheduled run)'
        required: false
        type: string
      archive:
        description: 'Optional: S3/R2 key of a specific historical bug archive to triage instead of auto-discovering the latest one (triage action only; ignored otherwise). See the Resolve archive/commit_hash step log for available keys.'
        required: false
        type: string
  schedule:
    - cron: '0 * * * *'           # manager: check upstream for new commits
    - cron: '0 0,6,12,18 * * *'   # cycle: build -> fuzz (~5h) -> triage (~1h)
    - cron: '30 3 * * *'          # daily-check: rebuild the coverage map if needed

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: cast-cycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  manager:
    name: CAST Manager
    if: inputs.action == 'manager' || inputs.action == 'cycle' || github.event.schedule == '0 * * * *'
    uses: manchester-fme/CAST/.github/workflows/manager.yml@v0.1.0
    with:
      solver: cvc5
      repo_url: https://github.com/cvc5/cvc5
      commit_hash: ${{ inputs.commit_hash }}
    secrets: inherit

  build:
    name: CAST Build
    needs: manager
    if: |
      always() &&
      (
        inputs.action == 'build' ||
        github.event.schedule == '0 0,6,12,18 * * *' ||
        (inputs.action == 'cycle' && needs.manager.result == 'success')
      )
    uses: manchester-fme/CAST/.github/workflows/build.yml@v0.1.0
    with:
      solver: cvc5
      repo_url: https://github.com/cvc5/cvc5
      build_script: cvc5/.cast/build.sh
      binary_path: build/bin/cvc5
      commit_hash: ${{ inputs.commit_hash }}
      # force_run left at its default (false): build only builds what
      # manager queued, so a commit only ever gets built/fuzzed once
      # manager has confirmed it actually touches C++.
    secrets: inherit

  fuzz:
    name: CAST Fuzz
    needs: build
    if: |
      always() &&
      (
        inputs.action == 'fuzz' ||
        github.event.schedule == '0 0,6,12,18 * * *' ||
        (inputs.action == 'cycle' && needs.build.result == 'success')
      )
    uses: manchester-fme/CAST/.github/workflows/commit-fuzzer.yml@v0.1.0
    with:
      solver: cvc5
      repo_url: https://github.com/cvc5/cvc5
      solver_dir: cvc5/.cast
      stop_buffer_minutes: 60  # GitHub's default 360-min job timeout minus this = ~5h fuzz budget
    secrets: inherit

  triage:
    name: CAST Triage
    needs: fuzz
    if: |
      always() &&
      (
        inputs.action == 'triage' ||
        github.event.schedule == '0 0,6,12,18 * * *' ||
        (inputs.action == 'cycle' && needs.fuzz.result == 'success')
      )
    uses: manchester-fme/CAST/.github/workflows/triage.yml@v0.1.0
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}  # this fork -- triage only ever reads manifest.json, never builds source
      solver_dir: cvc5/.cast
      target_cmd: "cvc5 --check-models --check-proofs --strings-exp"  # must exactly match KNOWN_SOLVER_EXTRA_ARGS['cvc5'] in src/commit_fuzzer/simple_commit_fuzzer.py -- that's the invocation fuzzing actually used to find these bugs
      oracle_cmd: "z3 smt.threads=1 memory_max_size=2048 model_validate=true"  # must exactly match KNOWN_SOLVER_EXTRA_ARGS['z3']
      # archive/commit_hash forward the top-level inputs (both empty on a
      # schedule tick or a plain action=triage, which auto-discovers the
      # latest of each). commit_hash lets a standalone triage run pin the
      # production build to fetch when the latest one no longer matches the
      # auto-discovered archive's commit (e.g. a newer commit was
      # built/fuzzed with no bugs since); archive lets it target a specific
      # historical bug archive instead of always the latest one.
      archive: ${{ inputs.archive }}
      commit_hash: ${{ inputs.commit_hash }}
      post: true
    secrets: inherit

  daily-check:
    name: CAST Daily Check
    if: inputs.action == 'daily-check' || github.event.schedule == '30 3 * * *'
    uses: manchester-fme/CAST/.github/workflows/coverage-daily-check.yml@v0.1.0
    with:
      solver: cvc5
      repo_url: https://github.com/cvc5/cvc5
      solver_dir: cvc5/.cast
    secrets: inherit
