name: CAST

run-name: >-
  CAST: ${{ inputs.action
  || (github.event.schedule == '0 * * * *' && 'manager')
  || (github.event.schedule == '30 3 * * *' && 'daily-check')
  || 'cycle' }}

# Hourly: manager queues new upstream commits. Every 6h: build -> fuzz
# (~5h) -> triage (~1h). Daily: rebuild the coverage map. See
# manchester-fme/CAST's README.md for the full setup contract.
#
# You do not need to edit anything in this file - it's already filled in
# for this fork. Leave the schedule, jobs, and conditions as they are.

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options:
          - cycle
          - manager
          - build
          - fuzz
          - triage
          - daily-check
      commit_hash:
        description: 'Optional: commit hash (manager/build/triage/cycle only; ignored on a scheduled run)'
        required: false
        type: string
      archive:
        description: 'Optional: S3/R2 key of a specific historical bug archive to triage instead of auto-discovering the latest one (triage action only; ignored otherwise). See the Resolve archive/commit_hash step log for available keys.'
        required: false
        type: string
  schedule:
    - cron: '0 * * * *'           # manager: check upstream for new commits
    - cron: '0 0,6,12,18 * * *'   # cycle: build -> fuzz (~5h) -> triage (~1h)
    - cron: '30 3 * * *'          # daily-check: rebuild the coverage map if needed

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: cast-cycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  manager:
    name: CAST Manager
    if: inputs.action == 'manager' || inputs.action == 'cycle' || github.event.schedule == '0 * * * *'
    uses: manchester-fme/CAST/.github/workflows/manager.yml@v0.4.0
    with:
      solver: cvc5
      repo_url: https://github.com/cvc5/cvc5
      commit_hash: ${{ inputs.commit_hash }}
    secrets: inherit

  build:
    name: CAST Build
    needs: manager
    if: |
      always() &&
      (
        inputs.action == 'build' ||
        github.event.schedule == '0 0,6,12,18 * * *' ||
        (inputs.action == 'cycle' && needs.manager.result == 'success')
      )
    uses: manchester-fme/CAST/.github/workflows/build.yml@v0.4.0
    with:
      solver: cvc5
      repo_url: https://github.com/cvc5/cvc5
      build_script: cvc5/.cast/build.sh
      binary_path: build/bin/cvc5
      commit_hash: ${{ inputs.commit_hash }}
    secrets: inherit

  fuzz:
    name: CAST Fuzz
    needs: build
    if: |
      always() &&
      (
        inputs.action == 'fuzz' ||
        github.event.schedule == '0 0,6,12,18 * * *' ||
        (inputs.action == 'cycle' && needs.build.result == 'success')
      )
    uses: manchester-fme/CAST/.github/workflows/commit-fuzzer.yml@v0.4.0
    with:
      solver: cvc5
      repo_url: https://github.com/cvc5/cvc5
      solver_dir: cvc5/.cast
      stop_buffer_minutes: 60
    secrets: inherit

  triage:
    name: CAST Triage
    needs: fuzz
    if: |
      always() &&
      (
        inputs.action == 'triage' ||
        github.event.schedule == '0 0,6,12,18 * * *' ||
        (inputs.action == 'cycle' && needs.fuzz.result == 'success')
      )
    uses: manchester-fme/CAST/.github/workflows/triage.yml@v0.4.0
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}  # this fork, not upstream
      solver_dir: cvc5/.cast
      archive: ${{ inputs.archive }}
      commit_hash: ${{ inputs.commit_hash }}
      post: true
    secrets: inherit

  daily-check:
    name: CAST Daily Check
    if: inputs.action == 'daily-check' || github.event.schedule == '30 3 * * *'
    uses: manchester-fme/CAST/.github/workflows/coverage-daily-check.yml@v0.4.0
    with:
      solver: cvc5
      repo_url: https://github.com/cvc5/cvc5
      solver_dir: cvc5/.cast
    secrets: inherit
