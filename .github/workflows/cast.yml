name: CAST

run-name: >-
  CAST: ${{ inputs.action || 'cycle' }}

# Every 6h: build the latest commit, fuzz it (~5h), then triage whatever
# bugs that run found (~1h) -- one sequential run per tick rather than
# separate manager/build/fuzz/coverage/daily-check schedules, to stay well
# under the org's Actions concurrency limits. `needs:` chains the three
# jobs so they run in order within a single workflow run instead of
# overlapping, and `concurrency:` below queues a tick rather than starting
# a second cycle if the previous one is still running long.
#
# There's no separate commit-polling step (manager.yml) any more --
# build.yml's force_run:true already resolves+builds the current upstream
# HEAD directly when its queue is empty, which it always is without
# manager.yml feeding it. Coverage-guided fuzzing (coverage.yml/
# daily-check.yml) is dropped too, so fuzz below runs no_coverage: the
# whole test suite each cycle rather than a commit-diff-selected subset.

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options:
          - cycle
          - build
          - fuzz
          - triage
      commit_hash:
        description: 'Optional: commit hash (build/cycle only; ignored on a scheduled run)'
        required: false
        type: string
  schedule:
    - cron: '0 0,6,12,18 * * *'  # cycle: build -> fuzz (~5h) -> triage (~1h)

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: cast-cycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: CAST Build
    if: inputs.action == 'cycle' || inputs.action == 'build' || github.event_name == 'schedule'
    uses: manchester-fme/CAST/.github/workflows/build.yml@main
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      build_script: cvc5/.cast/build.sh
      binary_path: build/bin/cvc5
      commit_hash: ${{ inputs.commit_hash }}
      force_run: true
    secrets: inherit

  fuzz:
    name: CAST Fuzz
    needs: build
    if: inputs.action == 'cycle' || inputs.action == 'fuzz' || github.event_name == 'schedule'
    uses: manchester-fme/CAST/.github/workflows/commit-fuzzer.yml@main
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: cvc5/.cast
      no_coverage: true
      stop_buffer_minutes: 60  # GitHub's default 360-min job timeout minus this = ~5h fuzz budget
    secrets: inherit

  triage:
    name: CAST Triage
    needs: fuzz
    if: inputs.action == 'cycle' || inputs.action == 'triage' || github.event_name == 'schedule'
    uses: manchester-fme/CAST/.github/workflows/triage.yml@main
    with:
      solver: cvc5
      target_cmd: "cvc5 --check-models --check-proofs"
      oracle_cmd: "z3 model_validate=true"
      # archive/commit_hash left empty: auto-discovers this cycle's build/bugs
      post: true
    secrets: inherit
