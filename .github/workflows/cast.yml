name: CAST

run-name: >-
  CAST: ${{ inputs.action
  || (github.event.schedule == '*/15 * * * *' && 'manager')
  || (github.event.schedule == '5,35 * * * *' && 'build')
  || (github.event.schedule == '0 0 1 * *' && 'coverage')
  || (github.event.schedule == '0 0 * * *' && 'daily-check')
  || (github.event.schedule == '45 0,6,12,18 * * *' && 'fuzz')
  || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options:
          - manager
          - build
          - coverage
          - daily-check
          - fuzz
      commit_hash:
        description: 'Required for fuzz; bypasses queue/schedule lookup for manager and build; ignored on a scheduled run'
        required: false
        type: string
  schedule:
    - cron: '*/15 * * * *'
    - cron: '5,35 * * * *'
    - cron: '0 0 * * *'
    - cron: '0 0 1 * *'
    - cron: '45 0,6,12,18 * * *'

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  # Manager tracks/queues commits from the real upstream repo (not this
  # fork's own history) so build-queue/fuzzing-schedule state, and every
  # downstream diff analysis, deal in genuine upstream commit hashes -
  # this fork exists only to host the .cast/ profile and this trigger,
  # never as the thing whose commits get tracked. Read from
  # .cast/manifest.json instead of hardcoding, so it can't drift from the
  # URL the rest of the profile (coverage/fuzzer sections) already uses.
  resolve-upstream:
    if: inputs.action == 'manager' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    outputs:
      upstream_repo_url: ${{ steps.read.outputs.upstream_repo_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Read upstream repo_url from .cast/manifest.json
        id: read
        run: echo "upstream_repo_url=$(jq -r '.coverage.repo_url' .cast/manifest.json)" >> "$GITHUB_OUTPUT"

  manager:
    if: inputs.action == 'manager' || github.event.schedule == '*/15 * * * *'
    needs: resolve-upstream
    uses: manchester-fme/CAST/.github/workflows/manager.yml@main
    with:
      solver: cvc5
      repo_url: ${{ needs.resolve-upstream.outputs.upstream_repo_url }}
      commit_hash: ${{ inputs.commit_hash }}
    secrets: inherit

  build:
    if: inputs.action == 'build' || github.event.schedule == '5,35 * * * *'
    uses: manchester-fme/CAST/.github/workflows/build.yml@main
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      build_script: cvc5/.cast/build.sh
      binary_path: build/bin/cvc5
      commit_hash: ${{ inputs.commit_hash }}
      force_run: true
    secrets: inherit

  coverage:
    if: inputs.action == 'coverage' || github.event.schedule == '0 0 1 * *'
    uses: manchester-fme/CAST/.github/workflows/coverage-mapper.yml@main
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: cvc5/.cast
    secrets: inherit

  daily-check:
    if: inputs.action == 'daily-check' || github.event.schedule == '0 0 * * *'
    uses: manchester-fme/CAST/.github/workflows/coverage-daily-check.yml@main
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: cvc5/.cast
    secrets: inherit

  fuzz:
    if: inputs.action == 'fuzz' || github.event.schedule == '45 0,6,12,18 * * *'
    uses: manchester-fme/CAST/.github/workflows/commit-fuzzer.yml@main
    with:
      solver: cvc5
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: cvc5/.cast
      commit_hash: ${{ inputs.commit_hash }}
    secrets: inherit
